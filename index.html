<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cruz del Sur · Acceso al panel de administración</title>
<style>
:root{
  --bg:#eef1f6; --panel:#ffffff; --ink:#0f1c33; --muted:#5a6780; --line:#d5dbe6;
  --night:#0f1c33; --night2:#18294a; --star:#e9c46a; --accent:#1f4fa3; --accent-ink:#ffffff;
  --err:#b3261e; --ok:#1d6b3f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a1220; --panel:#111d33; --ink:#e8edf6; --muted:#9aa8c2; --line:#26385a;
    --night:#0a1220; --night2:#13213d; --accent:#e9c46a; --accent-ink:#0f1c33;
    --err:#ff8a80; --ok:#7fd6a0;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1220; --panel:#111d33; --ink:#e8edf6; --muted:#9aa8c2; --line:#26385a;
  --night:#0a1220; --night2:#13213d; --accent:#e9c46a; --accent-ink:#0f1c33;
  --err:#ff8a80; --ok:#7fd6a0;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Sora","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  display:grid;place-items:center;padding:24px;line-height:1.5;
}
.card{
  width:100%;max-width:880px;display:grid;grid-template-columns:1fr 1fr;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;
}
.brand{
  background:linear-gradient(160deg,var(--night2),var(--night));color:#eef2fa;
  padding:40px 36px;display:flex;flex-direction:column;justify-content:space-between;min-height:460px;
}
.brand h1{margin:0 0 6px;font-size:1.6rem;font-weight:600;letter-spacing:.01em}
.brand p{margin:0;color:#b9c5dc;font-size:.95rem;max-width:30ch}
.cross{width:100%;max-width:240px;align-self:center;margin:24px 0}
.cross .s{fill:var(--star)}
.cross .l{stroke:#4a6190;stroke-width:1;stroke-dasharray:3 4}
.brand small{color:#8fa0c0;font-size:.8rem}
.form{padding:40px 36px;display:flex;flex-direction:column;justify-content:center}
.form h2{margin:0 0 4px;font-size:1.3rem;font-weight:600}
.form .sub{margin:0 0 24px;color:var(--muted);font-size:.92rem}
label{display:block;font-size:.88rem;font-weight:500;margin-bottom:6px}
.field{margin-bottom:18px}
input{
  width:100%;font:inherit;color:var(--ink);background:transparent;
  border:1px solid var(--line);border-radius:8px;padding:11px 12px;
}
input::placeholder{color:var(--muted);opacity:.8}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pw{position:relative}
.pw input{padding-right:92px}
.toggle{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  font:inherit;font-size:.8rem;background:transparent;color:var(--muted);
  border:1px solid transparent;border-radius:6px;padding:6px 10px;cursor:pointer;
}
.toggle:hover{color:var(--ink);border-color:var(--line)}
.actions{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}
button.btn{
  font:inherit;font-weight:600;border-radius:8px;padding:12px 18px;cursor:pointer;
  flex:1 1 140px;border:1px solid var(--line);background:transparent;color:var(--ink);
}
button.btn:hover{border-color:var(--muted)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.primary:hover{filter:brightness(1.08);border-color:var(--accent)}
.msg{min-height:1.4em;margin:16px 0 0;font-size:.88rem}
.msg.err{color:var(--err)} .msg.ok{color:var(--ok)}
@media (max-width:720px){
  body{padding:12px}
  .card{grid-template-columns:1fr}
  .brand{min-height:0;padding:28px 24px}
  .cross{max-width:140px;margin:16px 0}
  .form{padding:28px 24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.hidden{display:none!important}
#app{width:100%;max-width:1100px}
.bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;background:var(--night);color:#eef2fa;padding:14px 20px;border-radius:14px 14px 0 0}
.bar .r{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.85rem;color:#b9c5dc}
.bar button.btn{flex:0 0 auto;color:#eef2fa;border-color:#4a6190;padding:8px 12px}
.grid{display:grid;grid-template-columns:1fr 1.2fr;gap:16px;background:var(--panel);border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;padding:20px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.box{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px}
.box h3{margin:0 0 10px;font-size:1rem}
.box input,.box select{margin-bottom:10px}
select{width:100%;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px 12px}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500}
.scroll{overflow-x:auto}
.mini{width:100%;height:auto;display:block;border-radius:8px;background:var(--night)}
.mini .rt{stroke:#4a6190;stroke-width:2;stroke-dasharray:5 4}
.mini .tx{fill:#b9c5dc;font-size:11px}
.mini .lima{fill:var(--star)}
.mini .pt{fill:#eef2fa}
.mini .bad{fill:#ff5c5c}
.mini .ring{fill:none;stroke:#ff5c5c;stroke-width:2;animation:p 1.1s infinite}
@keyframes p{from{r:7;opacity:1}to{r:20;opacity:0}}
.inc{border-left:4px solid var(--err);padding:8px 12px;margin-bottom:10px;font-size:.88rem;background:var(--bg);border-radius:6px}
.muted{color:var(--muted);font-size:.88rem;margin:0}
@media (prefers-reduced-motion:reduce){.mini .ring{animation:none}}
</style>
</head>
<body>
<main class="card" id="loginCard">
  <section class="brand" aria-label="Cruz del Sur">
    <div>
      <h1>Cruz del Sur</h1>
      <p>Panel de administración</p>
    </div>
    <svg class="cross" viewBox="0 0 200 240" role="img" aria-label="Constelación de la Cruz del Sur">
      <line class="l" x1="100" y1="20" x2="108" y2="215"/>
      <line class="l" x1="30" y1="95" x2="170" y2="130"/>
      <circle class="s" cx="100" cy="20" r="7"/>
      <circle class="s" cx="108" cy="215" r="9"/>
      <circle class="s" cx="30" cy="95" r="6"/>
      <circle class="s" cx="170" cy="130" r="7"/>
      <circle class="s" cx="128" cy="168" r="3.5"/>
    </svg>
    <small>Acceso solo para personal autorizado.</small>
  </section>

  <section class="form">
    <h2>Ingresa a tu cuenta</h2>
    <p class="sub">Usa tus credenciales de administrador.</p>

    <form id="login" novalidate onsubmit="return false">
      <div class="field">
        <label for="user">Usuario</label>
        <input id="user" name="user" type="text" placeholder="Ingresar usuario" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="pass">Contraseña</label>
        <div class="pw">
          <input id="pass" name="pass" type="password" placeholder="Ingresar contraseña" autocomplete="current-password" required>
          <button type="button" class="toggle" id="toggle" aria-controls="pass" aria-pressed="false">Mostrar</button>
        </div>
      </div>
      <div class="actions">
        <button type="button" class="btn" id="later">Recordarme más tarde</button>
        <button type="submit" class="btn primary" id="enter">Ingresar</button>
      </div>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
    </form>
  </section>
</main>

<div id="app" class="hidden">
  <div class="bar">
    <strong id="quien"></strong>
    <div class="r">
      <span id="cuenta"></span>
      <button type="button" class="btn" id="sim">Simular incidencia</button>
      <button type="button" class="btn" id="salir">Cerrar sesión</button>
    </div>
  </div>
  <div class="grid">
    <div>
      <div class="box"><h3>Rutas</h3><div class="scroll"><table id="tR"></table></div></div>
      <div class="box"><h3>Conductores</h3><div class="scroll"><table id="tC"></table></div></div>
      <div class="box hidden" id="gest">
        <h3>Registrar ruta</h3>
        <input id="rOri" placeholder="Origen">
        <input id="rDes" placeholder="Destino">
        <input id="rKm" type="number" min="1" placeholder="Kilómetros">
        <button type="button" class="btn primary" id="bRuta">Agregar ruta</button>
        <h3 style="margin-top:18px">Registrar conductor</h3>
        <input id="cNom" placeholder="Nombre completo">
        <input id="cLic" placeholder="Licencia (ej. A-IIIc)">
        <select id="cRuta" aria-label="Ruta asignada"></select>
        <button type="button" class="btn primary" id="bCond">Agregar conductor</button>
        <p class="msg" id="gmsg" role="status" aria-live="polite"></p>
      </div>
    </div>
    <div>
      <div class="box"><h3>Mapa de rutas</h3><svg class="mini" id="mapa" viewBox="0 0 400 300" role="img" aria-label="Mapa en miniatura de las rutas"></svg></div>
      <div class="box"><h3>Incidencias</h3><div id="incs"><p class="muted">Sin incidencias todavía. Aparecerá una cada 1 a 3 minutos.</p></div></div>
    </div>
  </div>
</div>


<script>
(function(){
  var user=document.getElementById('user'),
      pass=document.getElementById('pass'),
      toggle=document.getElementById('toggle'),
      later=document.getElementById('later'),
      enter=document.getElementById('enter'),
      msg=document.getElementById('msg'),
      timer;

  function say(text,type){ msg.textContent=text; msg.className='msg '+(type||''); }

  // Ver la contraseña solo mientras se mantiene presionado el botón
  function show(){ pass.type='text'; toggle.textContent='Ocultar'; toggle.setAttribute('aria-pressed','true'); }
  function hide(){ pass.type='password'; toggle.textContent='Mostrar'; toggle.setAttribute('aria-pressed','false'); }
  toggle.addEventListener('mousedown',show);
  toggle.addEventListener('touchstart',function(e){e.preventDefault();show();},{passive:false});
  ['mouseup','mouseleave','touchend','touchcancel','blur'].forEach(function(ev){toggle.addEventListener(ev,hide);});
  toggle.addEventListener('keydown',function(e){ if(e.key===' '||e.key==='Enter'){e.preventDefault();show();} });
  toggle.addEventListener('keyup',hide);

  later.addEventListener('click',function(){
    clearTimeout(timer);
    user.value=''; pass.value=''; hide();
    say('Listo, te lo recordaremos más tarde.','ok');
  });

  enter.addEventListener('click',function(){
    clearTimeout(timer);
    if(!user.value.trim()){ say('Ingresa tu usuario.','err'); user.focus(); return; }
    if(!pass.value){ say('Ingresa tu contraseña.','err'); pass.focus(); return; }
    window.CDS.login(user.value.trim(),pass.value,say);
  });
})();
</script>

<script>
/* ===== Clases (mismo modelo que el proyecto Java) ===== */
class Usuario{
  constructor(u,c,rol){this.usuario=u;this.clave=c;this.rol=rol;}
  validar(u,c){return this.usuario===u&&this.clave===c;}
  puedeRegistrar(){return false;}
}
class Administrador extends Usuario{constructor(){super('admin','admin123','administrador');}}
class Gestor extends Usuario{constructor(){super('odin','odinadmin123','gestor');}puedeRegistrar(){return true;}}
class Ruta{
  constructor(id,o,d,km,x,y){this.id=id;this.origen=o;this.destino=d;this.km=km;this.x=x;this.y=y;}
  get nombre(){return this.origen+' - '+this.destino;}
}
class Conductor{constructor(id,n,l,ruta){this.id=id;this.nombre=n;this.licencia=l;this.ruta=ruta;}}
class Servicio{constructor(n,t){this.nombre=n;this.telefono=t;}}
class Incidencia{
  constructor(tipo,cond,serv){
    this.tipo=tipo;this.conductor=cond;this.ruta=cond.ruta;this.servicios=serv;
    this.hora=new Date().toLocaleTimeString('es-PE');this.t=0.2+Math.random()*0.7;
  }
}
class Sistema{
  constructor(){
    this.usuarios=[new Administrador(),new Gestor()];
    this.rutas=[
      new Ruta(1,'Lima','Ica',303,130,175),new Ruta(2,'Lima','Arequipa',1010,260,250),
      new Ruta(3,'Lima','Trujillo',560,150,60),new Ruta(4,'Lima','Huancayo',300,200,140),
      new Ruta(5,'Lima','Cusco',1100,340,190)];
    this.conductores=[
      new Conductor(1,'Carlos Quispe','A-IIIc',this.rutas[0]),new Conductor(2,'Luis Ramos','A-IIIc',this.rutas[1]),
      new Conductor(3,'Marco Soto','A-IIIb',this.rutas[2]),new Conductor(4,'Jorge Vega','A-IIIc',this.rutas[3]),
      new Conductor(5,'Pedro Lara','A-IIIb',this.rutas[4])];
    this.incidencias=[];this.actual=null;this.proxima=0;
  }
  login(u,c){return this.usuarios.find(x=>x.validar(u,c))||null;}
  agregarRuta(o,d,km){
    const r=new Ruta(this.rutas.length+1,o,d,km,120+Math.random()*240,30+Math.random()*230);
    this.rutas.push(r);return r;
  }
  agregarConductor(n,l,ruta){const c=new Conductor(this.conductores.length+1,n,l,ruta);this.conductores.push(c);return c;}
  generarIncidencia(){
    const c=this.conductores[Math.floor(Math.random()*this.conductores.length)];
    const choque=Math.random()<0.5;
    const serv=choque?[new Servicio('Policía Nacional','105'),new Servicio('Bomberos','116')]
      :[new Servicio('SAMU / Ambulancia','106'),new Servicio('Policía Nacional','105'),new Servicio('Bomberos','116')];
    const i=new Incidencia(choque?'Choque':'Accidente',c,serv);
    this.incidencias.unshift(i);this.actual=i;return i;
  }
  iniciarTemporizador(alGenerar,alContar){
    this.detener();
    const prog=()=>{
      const ms=(60+Math.random()*120)*1000; // 1 a 3 minutos
      this.proxima=Date.now()+ms;
      this.t1=setTimeout(()=>{alGenerar(this.generarIncidencia());prog();},ms);
    };
    prog();
    this.t2=setInterval(()=>alContar(Math.max(0,Math.round((this.proxima-Date.now())/1000))),1000);
  }
  detener(){clearTimeout(this.t1);clearInterval(this.t2);}
}

/* ===== Interfaz ===== */
(function(){
  const sis=new Sistema(),$=id=>document.getElementById(id);
  const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function tablas(){
    $('tR').innerHTML='<tr><th>N°</th><th>Ruta</th><th>Km</th></tr>'+
      sis.rutas.map(r=>`<tr><td>${r.id}</td><td>${esc(r.nombre)}</td><td>${r.km}</td></tr>`).join('');
    $('tC').innerHTML='<tr><th>N°</th><th>Nombre</th><th>Licencia</th><th>Ruta</th></tr>'+
      sis.conductores.map(c=>`<tr><td>${c.id}</td><td>${esc(c.nombre)}</td><td>${esc(c.licencia)}</td><td>${esc(c.ruta.nombre)}</td></tr>`).join('');
    $('cRuta').innerHTML=sis.rutas.map((r,i)=>`<option value="${i}">${esc(r.nombre)}</option>`).join('');
  }
  function mapa(){
    const L={x:60,y:220};
    let s='<path d="M0 275 Q120 250 200 282 T400 262 L400 300 L0 300Z" fill="#13213d"/>';
    sis.rutas.forEach(r=>{
      s+=`<line class="rt" x1="${L.x}" y1="${L.y}" x2="${r.x}" y2="${r.y}"/>`+
         `<circle class="pt" cx="${r.x}" cy="${r.y}" r="4"/><text class="tx" x="${r.x+6}" y="${r.y-6}">${esc(r.destino)}</text>`;
    });
    s+=`<circle class="lima" cx="${L.x}" cy="${L.y}" r="6"/><text class="lima" x="30" y="242" font-size="12">Lima</text>`;
    const i=sis.actual;
    if(i){
      const x=L.x+(i.ruta.x-L.x)*i.t,y=L.y+(i.ruta.y-L.y)*i.t;
      s+=`<circle class="ring" cx="${x}" cy="${y}" r="7"/><circle class="bad" cx="${x}" cy="${y}" r="6"/>`;
    }
    $('mapa').innerHTML=s;
  }
  function incidencias(){
    if(!sis.incidencias.length)return;
    $('incs').innerHTML=sis.incidencias.slice(0,6).map(i=>`<div class="inc">
      <strong>${i.tipo}</strong> a las ${i.hora}<br>Conductor: ${esc(i.conductor.nombre)}<br>Vía: ${esc(i.ruta.nombre)}<br>
      Llamar a: ${i.servicios.map(v=>esc(v.nombre)+' <strong>'+v.telefono+'</strong>').join(' · ')}</div>`).join('');
  }
  function nueva(i){mapa();incidencias();}
  function aviso(t,ok){const m=$('gmsg');m.textContent=t;m.className='msg '+(ok?'ok':'err');}

  window.CDS={
    login(u,c,say){
      const us=sis.login(u,c);
      if(!us){say('Usuario o contraseña incorrectos.','err');return;}
      say('','');$('pass').value='';
      $('loginCard').classList.add('hidden');$('app').classList.remove('hidden');
      $('quien').textContent=us.usuario+' ('+us.rol+')';
      $('gest').classList.toggle('hidden',!us.puedeRegistrar());
      tablas();mapa();
      sis.iniciarTemporizador(nueva,s=>{$('cuenta').textContent='Próxima incidencia en '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0');});
    }
  };
  $('sim').onclick=()=>{sis.generarIncidencia();nueva();};
  $('salir').onclick=()=>{
    sis.detener();sis.actual=null;
    $('app').classList.add('hidden');$('loginCard').classList.remove('hidden');$('user').value='';$('user').focus();
  };
  $('bRuta').onclick=()=>{
    const o=$('rOri').value.trim(),d=$('rDes').value.trim(),km=parseInt($('rKm').value,10);
    if(!o||!d||!(km>0))return aviso('Completa origen, destino y kilómetros válidos.',false);
    sis.agregarRuta(o,d,km);tablas();mapa();$('rOri').value=$('rDes').value=$('rKm').value='';aviso('Ruta agregada.',true);
  };
  $('bCond').onclick=()=>{
    const n=$('cNom').value.trim(),l=$('cLic').value.trim();
    if(!n||!l)return aviso('Completa nombre y licencia.',false);
    sis.agregarConductor(n,l,sis.rutas[$('cRuta').value]);tablas();$('cNom').value=$('cLic').value='';aviso('Conductor agregado.',true);
  };
})();
</script>
</body>
</html>
